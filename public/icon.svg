<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Thock app icon</title>
  <desc id="desc">A cream keyboard key with a rounded lowercase t on lavender. The square silhouette and inset face follow Thock's Cherry key shape.</desc>

  <!-- Shape from Thock's Cherry profile; colors and lettering retain the cute icon style. -->
  <rect id="background" width="1024" height="1024" fill="#C4AEE9"/>
  <g id="key-shape" stroke="#4B1043" stroke-width="16" stroke-linejoin="round">
    <rect id="base" x="211.2" y="211.2" width="601.6" height="601.6" rx="41.6" fill="#4B1043"/>
    <rect id="keycap" x="211.2" y="211.2" width="601.6" height="566.4" rx="41.6" fill="#E4CDA9"/>
  </g>
  <rect id="top-face" x="275.2" y="233.6" width="473.6" height="441.6" rx="44.8" fill="#FEF0D5"/>

  <!-- Centered, rounded lettering drawn with paths; no font dependency. -->
  <g id="letter-t" fill="none" stroke="#4B1043" stroke-width="58" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 495 356 V 497 Q 495 550 545 550 H 562"/>
    <path d="M 452 416 H 554"/>
  </g>
</svg>
