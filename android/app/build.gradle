apply plugin: 'com.android.application'

android {
    namespace 'app.thock'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'app.thock'
        minSdk 28        // Android 9: the first version that lets an app be a Bluetooth keyboard
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The keyboard UI is the same web app the Wi-Fi server serves.
    sourceSets {
        main {
            assets.srcDirs = ['../../public']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
